name: Idea or feature request
description: Something Ambrotype should do
labels: [idea]
body:
  - type: textarea
    id: what
    attributes:
      label: What you'd like
      description: What you want to do, and why. How Lightroom or another app does it helps too.
    validations:
      required: true
  - type: dropdown
    id: help
    attributes:
      label: Would you like to work on it?
      options:
        - "No, just the idea"
        - "Maybe, with some pointers"
        - "Yes"

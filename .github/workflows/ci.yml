name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install webview build dependencies (Linux, for the Tauri GUI) and a software Vulkan GPU
        if: runner.os == 'Linux'
        # A stalled package mirror once held a run for over half an hour; fail fast instead.
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev libxdo-dev
          # lavapipe: amb-gpu's tests compare GPU and CPU renders on it.
          sudo apt-get install -y mesa-vulkan-drivers
          # A virtual screen for the editor's UI test.
          sudo apt-get install -y xvfb
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Every crate's failures in one run, not only the first crate's.
      - run: cargo test --workspace --no-fail-fast
      # The editor itself, driven by a script: open, edit, undo, export
      # (crates/amb-gui/tests/ui, docs/recipes.md).
      - name: UI test (Linux, on a virtual screen)
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: |
          cargo build -p amb-gui -p amb-cli
          target/debug/amb testimage colorchecker "$RUNNER_TEMP/test.dng"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/cfg" XDG_CACHE_HOME="$RUNNER_TEMP/cache" XDG_DATA_HOME="$RUNNER_TEMP/data"
          for t in crates/amb-gui/tests/ui/*.js; do
            xvfb-run -a -s "-screen 0 1600x1000x24" target/debug/ambrotype --ui-test "$t" "$RUNNER_TEMP/test.dng"
          done

  licences:
    name: dependency licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses sources

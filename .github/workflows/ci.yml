name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The runners' package mirror is often slow (tens of KB/s), so the
      # downloaded packages are kept between runs and only new ones fetched.
      - name: Packages downloaded before (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache/restore@v4
        with:
          path: ~/apt-archives
          key: apt-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: apt-${{ runner.os }}-${{ runner.arch }}-
      - name: Install webview build dependencies (Linux, for the Tauri GUI) and a software Vulkan GPU
        if: runner.os == 'Linux'
        # A stalled package mirror once held a run for over half an hour; fail
        # rather than wait. The first run, with nothing kept yet, needs longest.
        timeout-minutes: 20
        run: |
          mkdir -p ~/apt-archives/partial
          apt="sudo apt-get -o Dir::Cache::Archives=$HOME/apt-archives -o Acquire::Retries=3"
          sudo apt-get update
          $apt install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev libxdo-dev
          # lavapipe: amb-gpu's tests compare GPU and CPU renders on it.
          $apt install -y mesa-vulkan-drivers
          # A virtual screen for the editor's UI test.
          $apt install -y xvfb
          # Lua 5.1, as in Lightroom, for the measuring kit's plug-in test.
          $apt install -y lua5.1
      # Kept even when the install timed out, so the next run carries on
      # from what this one fetched.
      - name: Keep the downloaded packages (Linux)
        if: always() && runner.os == 'Linux'
        run: |
          sudo chown -R "$USER" ~/apt-archives
          sudo rm -rf ~/apt-archives/partial ~/apt-archives/lock
      - if: always() && runner.os == 'Linux'
        uses: actions/cache/save@v4
        with:
          path: ~/apt-archives
          key: apt-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Every crate's failures in one run, not only the first crate's.
      - run: cargo test --workspace --no-fail-fast
      # The editor itself, driven by a script: open, edit, undo, export
      # (crates/amb-gui/tests/ui, docs/recipes.md).
      - name: UI test (Linux, on a virtual screen)
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: |
          cargo build -p amb-gui -p amb-cli
          target/debug/amb testimage colorchecker "$RUNNER_TEMP/test.dng"
          # A second folder, for showing folders together (browse.js).
          mkdir -p "$RUNNER_TEMP/more" && target/debug/amb testimage ramp "$RUNNER_TEMP/more/other.dng"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/cfg" XDG_CACHE_HOME="$RUNNER_TEMP/cache" XDG_DATA_HOME="$RUNNER_TEMP/data"
          for t in crates/amb-gui/tests/ui/*.js; do
            xvfb-run -a -s "-screen 0 1600x1000x24" target/debug/ambrotype --ui-test "$t" "$RUNNER_TEMP/test.dng"
          done
      # The Lightroom Classic plug-in (tools/lightroom-kit), against a stand-in
      # for Lightroom, on a kit session made by amb (the raw is a dummy file).
      - name: Lightroom plug-in test (Linux)
        if: runner.os == 'Linux'
        run: |
          echo dummy > "$RUNNER_TEMP/2414.ARW"
          target/debug/amb sweep generate --out "$RUNNER_TEMP/kit/4-lens" --groups tone,white_balance,lens --synthetic ramp "$RUNNER_TEMP/2414.ARW"
          lua5.1 tools/lightroom-kit/test-plugin.lua "$RUNNER_TEMP/kit/4-lens"

  licences:
    name: dependency licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses sources

name: Release

# Installers for every OS: on a version tag (v0.2.0), as a draft GitHub
# release to check and publish by hand; or by hand from the Actions tab,
# as build artifacts. Signing secrets are used when they exist (see
# docs/releasing.md); without them the installers are unsigned.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  bundle:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { name: windows-x64, os: windows-latest, target: x86_64-pc-windows-msvc }
          - { name: windows-arm64, os: windows-11-arm, target: aarch64-pc-windows-msvc }
          - { name: macos-arm64, os: macos-latest, target: aarch64-apple-darwin }
          # Intel Macs: built on an Apple Silicon runner (GitHub retired macos-13).
          - { name: macos-x64, os: macos-latest, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Webview build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev libxdo-dev libayatana-appindicator3-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build the amb CLI to ship with the editor
        shell: bash
        run: |
          cargo build --release -p amb-cli --target ${{ matrix.target }}
          ext=""; [[ "${{ runner.os }}" == "Windows" ]] && ext=".exe"
          cp "target/${{ matrix.target }}/release/amb$ext" "crates/amb-gui/binaries/amb-${{ matrix.target }}$ext"
      - name: Build the installers
        working-directory: crates/amb-gui
        env:
          # macOS signing and notarisation, when the secrets are set.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: cargo tauri build --target ${{ matrix.target }} --config tauri.release.conf.json
      - name: Collect the installers
        shell: bash
        run: |
          mkdir -p dist
          bundle="target/${{ matrix.target }}/release/bundle"
          find "$bundle" -maxdepth 2 -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.msi' -o -name '*-setup.exe' -o -name '*.dmg' \) -exec cp {} dist/ \;
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: ambrotype-${{ matrix.name }}
          path: dist/*
      - name: Attach to the draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          # The notes for this tag, if written (docs/release-notes/).
          body_path: docs/release-notes/${{ github.ref_name }}.md
          files: dist/*

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
publish = false
# Licence intentionally not set yet: pending the owner's decision (docs/SCOPE.md §6).

[workspace.dependencies]
quick-xml = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Decoding raws and embedded JPEG previews is very slow unoptimised; optimise
# just those libraries in debug builds so the editor stays usable while
# developing (a 24 MP preview: about 9 s unoptimised, 0.15 s optimised).
[profile.dev.package.rawler]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.zune-core]
opt-level = 3
[profile.dev.package.image]
opt-level = 3

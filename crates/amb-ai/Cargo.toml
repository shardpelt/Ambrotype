[package]
name = "amb-ai"
version = "0.1.0"
description = "Ambrotype's local AI models for masks: a list of freely licensed ones to install, the user's choice per task, and their own"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
amb-engine = { path = "../amb-engine" }
amb-gpu = { path = "../amb-gpu" }
serde.workspace = true
serde_json.workspace = true
regex = "1"
sha2.workspace = true
tract-onnx = "0.23"
tract-linalg = { version = "0.23", features = ["multithread-mm"] }
flate2.workspace = true
ureq.workspace = true

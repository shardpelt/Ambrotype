[package]
name = "amb-export"
version = "0.1.0"
description = "Export developed images: JPEG, PNG, TIFF, WebP, AVIF, OpenEXR; colour spaces with ICC profiles, resizing, output sharpening and EXIF metadata"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
amb-color = { path = "../amb-color" }
amb-engine = { path = "../amb-engine" }
flate2 = "1.1"
fontdue = "0.9.4"
half = "2.7"
image = { version = "0.25.10", default-features = false, features = ["png", "tiff", "webp", "avif", "exr", "rayon"] }
jpeg-encoder = "0.6"
rayon = "1"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
zune-core = "0.5"
zune-jpegxl = "0.5.2"

[dev-dependencies]
jxl-oxide = "0.12"

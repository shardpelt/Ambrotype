[package]
name = "amb-export"
version = "0.1.0"
description = "Export developed images: JPEG, PNG, TIFF, WebP, AVIF, OpenEXR; colour spaces with ICC profiles, resizing, output sharpening and EXIF metadata"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
amb-color = { path = "../amb-color" }
amb-engine = { path = "../amb-engine" }
image = { version = "0.25.10", default-features = false, features = ["png", "tiff", "webp", "avif", "exr", "rayon"] }
jpeg-encoder = "0.6"
rayon = "1"
thiserror.workspace = true

[package]
name = "amb-export"
version = "0.1.0"
description = "Export developed images: JPEG, PNG, TIFF, WebP, AVIF, OpenEXR; colour spaces with ICC profiles, resizing, output sharpening and EXIF metadata"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
amb-color = { path = "../amb-color" }
amb-engine = { path = "../amb-engine" }
flate2.workspace = true
fontdue = "0.9.4"
half = "2.7"
image = { workspace = true, features = ["png", "tiff", "webp", "avif", "exr", "rayon"] }
jpeg-encoder.workspace = true
# Edit Replay videos (src/video.rs); already in the build through AVIF export.
rav1e = { version = "0.8.1", default-features = false, features = ["threading"] }
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tiff = { version = "0.11", default-features = false, features = ["lzw"] }
zune-core = "0.5"
zune-jpegxl = "0.5.2"

[dev-dependencies]
jxl-oxide = "0.12"

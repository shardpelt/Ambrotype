[package]
name = "amb-gui"
version = "0.1.0"
description = "Ambrotype desktop editor (Tauri 2): open a raw, edit with sliders and presets, export"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ambrotype"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
amb-color = { path = "../amb-color" }
amb-engine = { path = "../amb-engine" }
amb-gpu = { path = "../amb-gpu" }
amb-export = { path = "../amb-export" }
amb-lens = { path = "../amb-lens" }
amb-library = { path = "../amb-library" }
amb-ai = { path = "../amb-ai" }
amb-plugin = { path = "../amb-plugin" }
amb-presets = { path = "../amb-presets" }
amb-protocol = { path = "../amb-protocol" }
jpeg-encoder = "0.6"
rayon = "1"
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
sha2 = "0.10"
ureq = { version = "2", features = ["native-certs"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
tauri-plugin-window-state = "2"
notify = "8"

# Already part of the editor through Tauri; used to read the monitor's
# colour profile from the desktop.
[target.'cfg(target_os = "linux")'.dependencies]
gdk = "0.18"

[dev-dependencies]
amb-testkit = { path = "../amb-testkit" }
image = { version = "0.25", default-features = false, features = ["png"] }

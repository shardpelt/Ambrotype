[package]
name = "amb-gui"
version = "0.1.0"
description = "Ambrotype desktop editor (Tauri 2): open a raw, edit with sliders and presets, export"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "ambrotype"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
amb-color = { path = "../amb-color" }
amb-engine = { path = "../amb-engine" }
amb-export = { path = "../amb-export" }
amb-lens = { path = "../amb-lens" }
amb-presets = { path = "../amb-presets" }
amb-protocol = { path = "../amb-protocol" }
jpeg-encoder = "0.6"
rayon = "1"
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
sha2 = "0.10"
ureq = "2"

[dev-dependencies]
amb-testkit = { path = "../amb-testkit" }

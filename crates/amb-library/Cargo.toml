[package]
name = "amb-library"
version = "0.1.0"
description = "Photo library operations on folders and sidecars: import with copy and rename, collections, HDR merge"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
amb-engine = { path = "../amb-engine" }
amb-export = { path = "../amb-export" }
amb-lens = { path = "../amb-lens" }
amb-presets = { path = "../amb-presets" }
amb-protocol = { path = "../amb-protocol" }
bzip2 = "0.6.1"
quick-xml.workspace = true
rayon = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
tar = "0.4.46"
ureq = { version = "2", features = ["native-certs"] }

[dev-dependencies]
amb-testkit = { path = "../amb-testkit" }

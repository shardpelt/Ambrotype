[package]
name = "amb-ops"
version = "0.1.0"
description = "Operations that render photos: raws to JPEGs, edit replays, HDR and panorama merges, objects, bursts, dust and negatives"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
amb-engine = { path = "../amb-engine" }
amb-export = { path = "../amb-export" }
amb-gpu = { path = "../amb-gpu" }
amb-lens = { path = "../amb-lens" }
amb-library = { path = "../amb-library" }
amb-presets = { path = "../amb-presets" }
amb-protocol = { path = "../amb-protocol" }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
rayon = "1"
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
amb-testkit = { path = "../amb-testkit" }

[package]
name = "amb-plugin"
version = "0.1.0"
description = "Ambrotype plugin host: manifests, the WebAssembly sandbox and running plugins"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
amb-plugin-sdk = { path = "../amb-plugin-sdk" }
amb-engine = { path = "../amb-engine" }
amb-export = { path = "../amb-export" }
amb-presets = { path = "../amb-presets" }
amb-protocol = { path = "../amb-protocol" }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
# Portable dispatch: the default tail-call dispatch can overflow the stack
# when the compiler doesn't turn its calls into jumps (seen in tests).
wasmi = { version = "2", default-features = false, features = ["std", "validate", "portable-dispatch"] }

[dev-dependencies]
wat = "1"

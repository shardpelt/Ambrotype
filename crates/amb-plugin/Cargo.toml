[package]
name = "amb-plugin"
version = "0.1.0"
description = "Ambrotype plugin host: manifests, the WebAssembly sandbox and running plugins"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
amb-plugin-sdk = { path = "../amb-plugin-sdk" }
amb-engine = { path = "../amb-engine" }
amb-export = { path = "../amb-export" }
amb-presets = { path = "../amb-presets" }
amb-protocol = { path = "../amb-protocol" }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
rayon = "1"
# The built-in effects, also run natively (the same code as their modules,
# many times faster than in the sandbox): native.rs.
amb-plugin-duotone = { path = "../../plugins/duotone" }
amb-plugin-light-leak = { path = "../../plugins/light-leak" }
amb-plugin-holographic = { path = "../../plugins/holographic" }
amb-plugin-hue-trip = { path = "../../plugins/hue-trip" }
amb-plugin-paint = { path = "../../plugins/paint" }
amb-plugin-tilt-shift = { path = "../../plugins/tilt-shift" }
amb-plugin-kaleidoscope = { path = "../../plugins/kaleidoscope" }
amb-plugin-heat-camera = { path = "../../plugins/heat-camera" }
# Portable dispatch: the default tail-call dispatch can overflow the stack
# when the compiler doesn't turn its calls into jumps (seen in tests).
wasmi = { version = "2", default-features = false, features = ["std", "validate", "portable-dispatch"] }

[dev-dependencies]
wat = "1"

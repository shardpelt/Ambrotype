[package]
name = "flb-cli"
version = "0.1.0"
description = "Flightbroom command-line tool"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "flb"
path = "src/main.rs"

[dependencies]
flb-presets = { path = "../flb-presets" }
flb-testkit = { path = "../flb-testkit" }
flb-engine = { path = "../flb-engine" }
flb-export = { path = "../flb-export" }
flb-color = { path = "../flb-color" }
flb-lens = { path = "../flb-lens" }
flb-protocol = { path = "../flb-protocol" }
serde_json.workspace = true

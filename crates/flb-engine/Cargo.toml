[package]
name = "flb-engine"
version = "0.1.0"
description = "Flightbroom processing engine (v0: raw decode, white balance, camera matrix, exposure, point curves, sRGB output)"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
flb-color = { path = "../flb-color" }
flb-presets = { path = "../flb-presets" }
rawler = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "tiff", "jpeg"] }
rayon = "1"
thiserror.workspace = true

[dev-dependencies]
flb-testkit = { path = "../flb-testkit" }

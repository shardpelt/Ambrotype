[package]
name = "flb-gui"
version = "0.1.0"
description = "Flightbroom desktop editor (Tauri 2): open a raw, edit with sliders and presets, export"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "flightbroom"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
flb-color = { path = "../flb-color" }
flb-engine = { path = "../flb-engine" }
flb-export = { path = "../flb-export" }
flb-lens = { path = "../flb-lens" }
flb-presets = { path = "../flb-presets" }
flb-protocol = { path = "../flb-protocol" }
jpeg-encoder = "0.6"
rayon = "1"
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[dev-dependencies]
flb-testkit = { path = "../flb-testkit" }

# cargo-deny: every dependency's licence must be compatible with
# GPL-3.0-or-later, and no crate may come from outside crates.io.
# Run: cargo deny check licenses sources

[graph]
all-features = false

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    "GPL-3.0-or-later",
    # rawler (raw decoding). LGPL-2.1 code may be used under the GPL
    # (its section 3), so it combines with GPL-3.0-or-later.
    "LGPL-2.1",
    # Permissive: jpeg-encoder's IJG part, libfuzzer-sys (via rav1e),
    # webpki-roots' certificate data.
    "IJG",
    "NCSA",
    "CDLA-Permissive-2.0",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
